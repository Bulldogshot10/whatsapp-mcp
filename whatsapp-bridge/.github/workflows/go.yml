name: Go

on:
  push:
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: whatsapp-bridge/go.sum

      - name: Download dependencies
        working-directory: whatsapp-bridge
        run: go mod download

      - name: Test
        working-directory: whatsapp-bridge
        run: go test ./...

      - name: Build Linux
        working-directory: whatsapp-bridge
        run: go build ./...
